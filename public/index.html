<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar Playlist YouTube MP3</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #e11d48; }
        #status {
            margin-top: 1.2rem;
            font-size: 0.95rem;
            color: #38bdf8;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Playlist YouTube → MP3 (.ZIP)</h1>
        <p class="subtitle">Cole o link da playlist abaixo. O download começará automaticamente.</p>
        <input type="text" id="urlInput" placeholder="Cole o link da playlist aqui (Ctrl+V)...">
        <div id="status"></div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const status = document.getElementById('status');

        function iniciarDownload(url) {
            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                status.style.color = '#f87171';
                status.textContent = 'Por favor, cole um link válido do YouTube.';
                return;
            }

            status.style.color = '#38bdf8';
            status.textContent = 'Baixando e convertendo todas as músicas da playlist... Aguarde (playlists grandes levam alguns minutos).';

            // Dispara o download do arquivo ZIP
            window.location.href = `/convert?url=${encodeURIComponent(url)}`;
        }

        // Dispara automaticamente assim que o usuário cola o link
        urlInput.addEventListener('paste', (event) => {
            setTimeout(() => {
                const urlColada = urlInput.value.trim();
                iniciarDownload(urlColada);
            }, 100);
        });

        // Também permite apertar Enter caso digite manualmente
        urlInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                iniciarDownload(urlInput.value.trim());
            }
        });
    </script>
</body>
</html>
